# ========================================
# MindScribe Backend - Application Config
# ========================================

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# H2 Database (file-based, dev)
# ==============================
spring.datasource.url=jdbc:h2:file:./data/mindscribe
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.mindscribe=DEBUG
# ==============================
# Railway profile (MySQL, prod)
# ==============================
spring.config.activate.on-profile=railway

# Use Railway's MySQL (env vars come from Railway)
spring.config.activate.on-profile=railway

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
management.endpoints.web.exposure.include=mappings
management.endpoint.health.show-details=never

# Railway will inject PORT
server.port=${PORT:8080}

# Disable H2 console in prod
spring.h2.console.enabled=false

