########################################
# MindScribe Backend - Application Config
# Using H2 in file mode (data stored on disk)
########################################

# Server Configuration
server.port=8080

# === H2 Database (file mode, persistent on disk) ===
# This creates/uses a file under ./data/mindscribe.mv.db in your project folder
spring.datasource.url=jdbc:h2:file:./data/mindscribe;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (optional – you can disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JPA / Hibernate Configuration ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

