########################################
# MindScribe Backend - Application Config
# Using H2 in file mode (data stored on disk)
########################################

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# H2 Database (file-based, dev)
# ==============================
spring.datasource.url=jdbc:h2:file:./data/mindscribe
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================
# JPA / Hibernate
# ==============================
# === H2 Database (file mode, persistent on disk) ===
# This creates/uses a file under ./data/mindscribe.mv.db in your project folder
spring.datasource.url=jdbc:h2:file:./data/mindscribe;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (optional – you can disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JPA / Hibernate Configuration ===
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.mindscribe=DEBUG
